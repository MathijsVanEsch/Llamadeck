version: '3.8'

services:
  sfrp-llamacpp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llamacpp
    image: sfrp:llamacpp-cuda
    container_name: sfrp-llamacpp
    ports:
      - "8080:8080"
    volumes:
      - ./data/llamacpp:/data
      - ./models:/models  # Mount models directory
      - ~/.cache/llama.cpp:/root/.cache/llama.cpp  # Llama.cpp cache
    environment:
      # Set data directory for persistence
      - SFRP_DATA_DIR=/data
      # Enable Docker mode for nested containers (if needed)
      - SFRP_LLAMACPP_DOCKER_ENABLED=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  sfrp-vllm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    image: sfrp:vllm-cuda
    container_name: sfrp-vllm
    ports:
      - "8081:8080"  # Use different port to avoid conflicts
    volumes:
      - ./data/vllm:/data
      - ./models:/models  # Mount models directory
      - ~/.cache/huggingface:/root/.cache/huggingface  # HuggingFace cache
    environment:
      # Set data directory for persistence
      - SFRP_DATA_DIR=/data
      # Enable Docker mode for nested containers (if needed)
      - SFRP_VLLM_DOCKER_ENABLED=false
      # vLLM specific environment variables
      - CUDA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped


Readiness is exposed at `/ready`; the compose healthcheck uses it.
